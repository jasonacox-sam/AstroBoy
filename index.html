<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroBoy 🚀</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; }
    #ui {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #7df; text-align: center; pointer-events: none;
      text-shadow: 0 0 10px #0af;
    }
    #ui h1 { font-size: 1.8rem; letter-spacing: 0.2em; }
    #ui p  { font-size: 0.8rem; opacity: 0.6; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>✦ ASTROBOY ✦</h1>
    <p>lost in the good kind of way</p>
  </div>
  <canvas id="c"></canvas>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- Scene ---
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000010, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 1.6, 6);

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    // --- Stars ---
    const starGeo = new THREE.BufferGeometry();
    const starCount = 6000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 1600;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 })));

    // --- Lights ---
    scene.add(new THREE.AmbientLight(0x112244, 2));
    const sun = new THREE.DirectionalLight(0xffeedd, 3);
    sun.position.set(5, 8, 4);
    scene.add(sun);
    const rimLight = new THREE.DirectionalLight(0x4488ff, 1.5);
    rimLight.position.set(-4, 2, -3);
    scene.add(rimLight);

    // --- Boy parts (low-poly geometric figure) ---
    const bodyMat  = new THREE.MeshStandardMaterial({ color: 0xf4a261, roughness: 0.7 });
    const suitMat  = new THREE.MeshStandardMaterial({ color: 0xe8f4f8, roughness: 0.4, metalness: 0.2 });
    const helmetMat = new THREE.MeshStandardMaterial({ color: 0xaaddff, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.85 });
    const darkMat  = new THREE.MeshStandardMaterial({ color: 0x223355, roughness: 0.8 });
    const glowMat  = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8, roughness: 0.2 });

    const boy = new THREE.Group();
    scene.add(boy);

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), suitMat);
    torso.position.y = 0.45;
    boy.add(torso);

    // Chest pack (life support)
    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.15), darkMat);
    chest.position.set(0, 0.55, 0.27);
    boy.add(chest);
    const indicator = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.05), glowMat);
    indicator.position.set(0.1, 0.6, 0.34);
    boy.add(indicator);

    // Backpack (oxygen)
    const pack = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, 0.2), darkMat);
    pack.position.set(0, 0.5, -0.28);
    boy.add(pack);

    // Hips
    const hips = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.25, 0.38), suitMat);
    hips.position.y = -0.05;
    boy.add(hips);

    // Head + neck
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.15, 8), suitMat);
    neck.position.y = 0.97;
    boy.add(neck);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), bodyMat);
    head.position.y = 1.28;
    boy.add(head);

    // Helmet
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12), helmetMat);
    helmet.position.y = 1.28;
    boy.add(helmet);

    // Eyes (visible through visor)
    for (const x of [-0.1, 0.1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x111111 }));
      eye.position.set(x, 1.3, 0.28);
      boy.add(eye);
    }

    // Arms
    function makeArm(side) {
      const arm = new THREE.Group();
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.5, 8), suitMat);
      upper.position.y = -0.25;
      arm.add(upper);
      const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.45, 8), suitMat);
      lower.position.y = -0.72;
      arm.add(lower);
      const glove = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), darkMat);
      glove.position.y = -0.97;
      arm.add(glove);
      arm.position.set(side * 0.47, 0.85, 0);
      arm.rotation.z = -side * 0.3;
      return arm;
    }
    const leftArm  = makeArm(-1);
    const rightArm = makeArm(1);
    boy.add(leftArm, rightArm);

    // Legs
    function makeLeg(side) {
      const leg = new THREE.Group();
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.55, 8), suitMat);
      upper.position.y = -0.27;
      leg.add(upper);
      const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.1, 0.5, 8), suitMat);
      lower.position.y = -0.78;
      leg.add(lower);
      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.15, 0.3), darkMat);
      boot.position.set(0.02, -1.07, 0.04);
      leg.add(boot);
      leg.position.set(side * 0.2, -0.05, 0);
      return leg;
    }
    const leftLeg  = makeLeg(-1);
    const rightLeg = makeLeg(1);
    boy.add(leftLeg, rightLeg);

    // Thruster glow
    const thruster = new THREE.PointLight(0x00ffcc, 2, 3);
    thruster.position.set(0, -0.2, -0.5);
    boy.add(thruster);
    const thrusterGeo = new THREE.ConeGeometry(0.08, 0.4, 8);
    const thrusterMesh = new THREE.Mesh(thrusterGeo,
      new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.5, transparent: true, opacity: 0.7 }));
    thrusterMesh.rotation.x = Math.PI;
    thrusterMesh.position.set(0, -0.55, -0.35);
    boy.add(thrusterMesh);

    // --- Floating debris ---
    const debris = [];
    for (let i = 0; i < 18; i++) {
      const geo = Math.random() > 0.5
        ? new THREE.OctahedronGeometry(Math.random() * 0.12 + 0.04)
        : new THREE.IcosahedronGeometry(Math.random() * 0.1 + 0.03);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(Math.random() * 0.15 + 0.55, 0.4, 0.5),
        roughness: 0.8,
      }));
      mesh.position.set(
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 5,
        (Math.random() - 0.5) * 6 - 1
      );
      mesh.userData.spin = (Math.random() - 0.5) * 0.02;
      mesh.userData.drift = new THREE.Vector3(
        (Math.random() - 0.5) * 0.003,
        (Math.random() - 0.5) * 0.003,
        0
      );
      scene.add(mesh);
      debris.push(mesh);
    }

    // --- Animate ---
    const clock = new THREE.Clock();
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      t += dt;

      // Boy floats and gently tumbles
      boy.position.y  = Math.sin(t * 0.5) * 0.18;
      boy.position.x  = Math.sin(t * 0.3) * 0.08;
      boy.rotation.y  = Math.sin(t * 0.25) * 0.25;
      boy.rotation.z  = Math.sin(t * 0.4) * 0.06;

      // Arm sway (idle drift)
      leftArm.rotation.z  = -0.3 + Math.sin(t * 0.6) * 0.15;
      rightArm.rotation.z =  0.3 - Math.sin(t * 0.6 + 1) * 0.15;
      leftArm.rotation.x  = Math.sin(t * 0.4) * 0.1;
      rightArm.rotation.x = Math.sin(t * 0.4 + 0.5) * 0.1;

      // Leg drift
      leftLeg.rotation.x  = Math.sin(t * 0.5) * 0.08;
      rightLeg.rotation.x = Math.sin(t * 0.5 + 1) * 0.08;

      // Thruster flicker
      thruster.intensity = 1.8 + Math.sin(t * 12) * 0.4;
      thrusterMesh.scale.y = 0.9 + Math.sin(t * 10) * 0.15;

      // Debris drift
      for (const d of debris) {
        d.rotation.x += d.userData.spin;
        d.rotation.y += d.userData.spin * 0.7;
        d.position.addScaledVector(d.userData.drift, 1);
        if (Math.abs(d.position.x) > 5) d.userData.drift.x *= -1;
        if (Math.abs(d.position.y) > 3.5) d.userData.drift.y *= -1;
      }

      // Camera slow drift
      camera.position.x = Math.sin(t * 0.1) * 0.3;
      camera.lookAt(0, 0.8, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
